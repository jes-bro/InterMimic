# SOURCE-TEACHER TRANSFORMER + HUMAN AUG + OBJECT AUG + GEOMETRY AUG: source sub7 driving 13 real
# + 40 synthetic bodies, AND size/pose-perturbed objects; body-conditioned.
# This is the cheap test of "can a per-source teacher learn
# 1-source x 14-bodies WITHOUT staging?" -- if it converges cleanly here, the
# teacher-student direction (14 source-teachers -> 1 distilled student) is
# validated as an alternative to the staged curriculum.
#
# Fixings ON: neutral betas (load-bearing for multi-body conditioning),
# body-normalized reward (remove body-size bias across 14 bodies), pose reward
# (relative joint-angle, aids tracking accuracy), PSI (physicalBufferSize).
# cpuMotionData is OFF on purpose: one source's clips is small, offload would
# only add per-step transfer for no VRAM win. No mask-dead-envs / pair-weights
# (all 14 bodies are live; that machinery is curriculum-only).
env:
  numEnvs: 4096  # 4096 fits w/o offload: single-source motion is tiny; only obs/experience grows
  envSpacing: 2
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: False
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2
  stateInit: "Hybrid"
  rolloutLength: 300
  hybridInitProb: 0.1
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub7']
  # 13 real train bodies (sub13 held out) + 40 TARGET-ONLY synthetic bodies
  # (sub100..sub139): driven by the sub7 source, scored vs the real reference,
  # body-norm handles the size gap. Tests: do synthetic bodies train in a
  # source-teacher WITHOUT staging (the curriculum folds them in gradually)?
  subjectBodies: ['sub1', 'sub2', 'sub3', 'sub5', 'sub6', 'sub7', 'sub8', 'sub9', 'sub11', 'sub12', 'sub14', 'sub15', 'sub17', 'sub100', 'sub101', 'sub102', 'sub103', 'sub104', 'sub105', 'sub106', 'sub107', 'sub108', 'sub109', 'sub110', 'sub111', 'sub112', 'sub113', 'sub114', 'sub115', 'sub116', 'sub117', 'sub118', 'sub119', 'sub120', 'sub121', 'sub122', 'sub123', 'sub124', 'sub125', 'sub126', 'sub127', 'sub128', 'sub129', 'sub130', 'sub131', 'sub132', 'sub133', 'sub134', 'sub135', 'sub136', 'sub137', 'sub138', 'sub139']
  betas_file: scripts/omomo_betas_neutral_aug.npz
  bodyNormalizedReward: true
  subjectHeightsFile: scripts/synthetic_heights.json  # heights for sub100+ (body-norm)
  ballSize: 1.
  numObs: 6524
  useTransformerObs: true  # transformer policy
  # --- OBJECT AUGMENTATION (physics) -----------------------------------------
  # Same object mesh, perturbed per env/episode: size U(0.85,1.15) with shell-mass
  # correction, +/-~15deg yaw, +/-3cm XY translate. The stock object-match reward
  # terms (ro*rig*rcg) are DROPPED: a perturbed object no longer follows the
  # reference object trajectory, so those terms would penalize correct behaviour.
  # The hold term (hands-on-object + relaxed contact) carries the interaction, and
  # object/ig/contact resets auto-relax to human-only whenever objectAug is on.
  # Phase-1 realistic ranges; per-object ranges + obs conditioning + a range
  # curriculum are deliberate follow-ups.
  objectAug:
    enable: true
    scaleMin: 0.85
    scaleMax: 1.15
    yawRad: 0.26          # ~15 deg
    translateM: 0.03      # +/- 3 cm
    massExp: 2            # shell mass model (2=shell, 3=solid)
    geom:
      enable: true
      numVariants: 8       # anisotropic shape variants pre-baked per object (v0=identity)
      anisoMin: 0.80       # per-axis scale range, independent x/y/z (proportion change)
      anisoMax: 1.20
  objectTermsEnable: false
  rewardTerms:
    pose:
      enable: true
      lambda: 0.02
    hold:
      enable: true
      lambda: 5.0
  motion_file: InterAct/OMOMO_new
  robotType: "smplx/omomo.xml"
  objectDensity: 200
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3","L_Thumb3","R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3","R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True
  physicalBufferSize: 3

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.7

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.
    op: 5.0
    or: 0.1
    opv: 0.1
    orv: 0.
    ig: 5.
    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.
    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 20.0
    max_gpu_contact_pairs: 34603008

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
