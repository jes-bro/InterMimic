# STUDENT, ACTIVITIES WITHOUT CPR (act_nocpr), XF / RET / NVADLR, METHOD CANDIDATE
# nopose. Distills the bball7 + soccer15 g3 teachers (2 checkpoints, 22 sources =
# the act student's 35 minus cpr13's 13) into one 6-TOKEN TRANSFORMER student via
# InterMimicDistillG3, WITHOUT the relative joint-angle reward factor. NOT an
# ablation: the teacher nopose arm beat the with-pose teacher, so the pose term
# is being dropped from the method and this is the candidate recipe.
#
# Hand-written from omomo_student_g3_act_xf_ret_nvadlr_tfinal__f0.yaml. Keys that
# differ from it (python3 scripts/cfg_diff.py), and why each one:
#   dataSub              35 -> 22 sources: the act roster minus cpr13's 13
#   motion_file          InterAct/behave_cari4d_act       -> ..._act_nocpr        (own merge)
#   retargetedMotionDir  InterAct/behave_cari4d_act_f0_bodymajor -> ..._act_nocpr_f0_bodymajor
#   objectPropsFile      object_props_g3_act.yaml         -> object_props_g3_act_nocpr.yaml
#   teacherPolicy        checkpoints/teachers/g3_act_tfinal -> checkpoints/teachers/g3_act_nocpr
#   rewardTerms.pose.enable  true -> false               (the method change; lambda left inert)
# The first four are ONE change (a merged data set is built per source set by
# scripts/merge_activity_data.py, which also writes the props file and refuses a
# roster mismatch at launch); the teacher dir is its own so the manifest records
# which bball7 / soccer15 snapshots it saw ("final" = latest at collect time).
# plane.restitution stays 0.7 (the act student's), so the solved per-object
# restitutions (bball 1.0, soccer 0.6) and the physics are the act student's.
# Everything else -- bodies, recipe, horizons, physics -- is the act student's.
#
# NO with-pose control exists for this source set (Jess 2026-09-25: nopose only);
# its read is against the act (with cpr) students, so "no cpr" and "no pose"
# are confounded there until a with-pose act_nocpr twin is trained.
#
# WHERE THE KEY BITES IN A STUDENT (learning/intermimic_agent_distill.py
# calc_gradients): the env reward reaches the loss only through the critic
# (warm-in from epoch 2300) and the PPO actor term (epoch > 2900, once the
# critic's explained variance holds). Below epoch 2300 the loss is the expert
# (BC) term alone, PSI harvest ranks by episode length not reward, and
# termination is resetThresholds. Read at a MATCHED EPOCH well past 2900.
#
# See the act MLP twin's header for every data / physics decision, and the OMOMO
# XF twin's for the 6-token layout (transformer.num_tokens 6, readout token 0).
