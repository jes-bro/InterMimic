# MULTI-SOURCE teacher: 2 sources (sub2, sub6).
#
# TWO functional edits vs g3_omomo_nobetas__f0 -- and they are one change, not two:
#   dataSub             ['sub2'] -> ['sub2', 'sub6']
#   retargetedMotionDir src2 tree -> the MERGED tree
#
# The second follows from the first. Retargeting is solved per SOURCE, so each
# tree holds one source's clips laid out by target body
# (<dir>/<body>/sub<SRC>_<obj>_<idx>.pt). The task reads exactly ONE directory
# (intermimic.py:302-334), so an arm loading 2 sources needs all 2 sources'
# clips under each body. Build it with scripts/merge_retarget_trees.py -- it is
# a symlink farm over the existing per-source trees, no re-solving.
#
# WHAT THIS ASKS. Every teacher so far is single-source. Before scaling to one
# teacher per source subject, we need to know whether ONE teacher can carry
# several sources without losing per-source quality. Read it by evaluating each
# source separately and comparing against g3_omomo_nobetas__f0, which is the same recipe on
# sub2 alone -- so the ladder 1 -> 2 -> 3 sources has its first rung already
# trained and this arm differs from it in the source set and nothing else.
#
# NO BETAS, so source_betas stays a zero vector and adding sources does not
# change what the conditioning vector means. On a betas arm it would, and the
# comparison against the single-source rung would not be clean.
