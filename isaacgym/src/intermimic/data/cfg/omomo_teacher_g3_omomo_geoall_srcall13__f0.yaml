# ALL-SOURCE teacher: every non-held-out OMOMO source (13 subjects) on the g3
# geoall recipe, f0's 43 bodies. THREE functional edits vs g3_omomo_geoall__f0:
#
#   dataSub              13 sources instead of sub2
#   retargetedMotionDir  the merged tree of all 13 per-source retarget trees
#                        (scripts/merge_retarget_trees.py; see the launcher header)
#   raggedMotionData     true -- REQUIRED here, see below
#
# WHY RAGGED. The reference tensors are per (body, clip): 43 x 3356 = 144,308
# motions. Padded to the longest clip (652 frames, sub11) that is 774 GiB of
# motion and ~1.6 TB resident by the validated RAM model -- MORE than a whole
# simurgh node (1.5 TB). Stored ragged (each clip at its own length, mean 191
# frames) it is 226 GiB; scripts/motion_memory_budget.py has the arithmetic:
#
#   python3 scripts/motion_memory_budget.py --motion-dir InterAct/OMOMO_new \
#       --cfg isaacgym/src/intermimic/data/cfg/omomo_teacher_g3_omomo_geoall_srcall13__f0.yaml
#
# raggedMotionData changes STORAGE only: every (motion, t) a reader can ask for
# returns the same values as the padded tensor (tests/test_ragged_motion.py is
# differential against the padded assembly, including the PSI write). It is
# the first arm to run with it, so its `[mem] motion tensors:` line and MaxRSS
# are the numbers that calibrate the ragged RAM factor for later arms.
#
# WHAT THIS ASKS. The top of the source-quantity ladder: src1 (1) -> src1src2 (2)
# -> srctop3 (3) -> srcall13 (13, 3356 clips, every object). Read per source
# against the single-source rung -- an aggregate hides one source collapsing
# while another improves. Same held-out bodies as every f0 cell (sub10 sub13
# sub16 are never trained on; sources and target bodies are separate axes).
#
# NO BETAS on the recipe, so the observation carries no conditioning vector and
# adding sources cannot change its meaning. Everything else is the g3 recipe
# verbatim: obsHorizons [1,4,7,10,13,16], numObs 9594, geometric_all, rollout 50,
# initVel, PSI 3, pose 0.02, bodyNormalizedReward, cpuMotionData, gate resets,
# all four resetThresholds, buffer 12.0, 2048 envs via the launcher.
