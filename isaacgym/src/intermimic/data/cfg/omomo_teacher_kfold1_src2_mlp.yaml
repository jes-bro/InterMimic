# GENERATED by scripts/generate_kfold_cfgs.py -- fold1 of the body
# k-fold CV. TEST (held-out) = ['sub5', 'sub7', 'sub12']; do not add them back.
# Synthetics within 2.1064224243164062 beta-L2 of a test body are
# excluded (sub121-style leak guard). Base: omomo_teacher_src2_mlp_lowbuf.yaml
# PhysX-HEADROOM VARIANT of omomo_teacher_src2_xf_aug.yaml. Identical EXCEPT
# default_buffer_size_multiplier 20.0 -> 12.0 (see the sim.physx block below).
#
# Why: this family runs at ~97% of a 44G L40S. Job 16354240 (normval_adlr) sat at
# 42.6-43.4/44G for 55h -- it survived only because PhysX had already grown its
# buffers and never needed a new allocation. The resume (job 16433830) had to
# rebuild that footprint from scratch and died at step 1, at 32.6/44G and still
# climbing, with `PxgCudaDeviceMemoryAllocator fail to allocate 203673600 bytes`.
# Nothing regressed between the two jobs; there was never more than ~1G of slack,
# so every restart is a coin flip. cpuMotionData cannot help here -- single-source
# motion tensors are only 0.15G (hoi_data 0.08 + hoi_refs 0.07); the ~30G is PhysX.
#
# Why THIS knob and not max_gpu_contact_pairs: the multiplier sizes PhysX's GPU
# scratch buffers (found/lost pairs, aggregate pairs, constraint blocks). Sized
# large enough it has NO effect on simulation results -- it is pure VRAM
# reservation -- and undersized it warns rather than silently changing physics.
# max_gpu_contact_pairs is a hard cap: exceed it and contacts are DROPPED, which
# would corrupt HOI contact physics. Left untouched at 34603008.
#
# ACCEPTANCE TEST (this is unvalidated until it is run):
#   1. no PhysX capacity/overflow warnings in the job log
#   2. `[mem]` settles below ~40/44G
#   3. `[reward-breakdown]` contact column matches known-good job 16354240:
#      rcg mean 0.618; by object largetable 0.753 monitor 0.574 woodchair 0.622
#      trashcan 0.522. A sagging rcg means contacts are being dropped -> step the
#      multiplier back up.
# If it fails, the next lever is numEnvs -- but that changes batch = envs*horizon
# and so breaks comparability with this arm's own first 11,600 epochs.
#
# Routed ONLY from slurm_teacher_src2_xf_aug_normval_adlr.sh. The other four arms
# on the shared yaml (src2_xf_aug, _normval, _adlr, _lr4) are deliberately NOT
# switched over until this is validated.
#
# --- original header follows ---
#
# SOURCE-TEACHER TRANSFORMER + HUMAN AUG: source sub2 driving 13 real + 40 synthetic bodies,
# body-conditioned. This is the cheap test of "can a per-source teacher learn
# 1-source x 14-bodies WITHOUT staging?" -- if it converges cleanly here, the
# teacher-student direction (14 source-teachers -> 1 distilled student) is
# validated as an alternative to the staged curriculum.
#
# Fixings ON: neutral betas (load-bearing for multi-body conditioning),
# body-normalized reward (remove body-size bias across 14 bodies), pose reward
# (relative joint-angle, aids tracking accuracy), PSI (physicalBufferSize).
# cpuMotionData is OFF on purpose: one source's clips is small, offload would
# only add per-step transfer for no VRAM win. No mask-dead-envs / pair-weights
# (all 14 bodies are live; that machinery is curriculum-only).
env:
  numEnvs: 4096  # 4096 fits w/o offload: single-source motion is tiny; only obs/experience grows
  envSpacing: 2
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: False
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2
  stateInit: "Hybrid"
  rolloutLength: 300
  hybridInitProb: 0.1
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub2']
  # 13 real train bodies (sub13 held out) + 39 TARGET-ONLY synthetic bodies (sub121 dropped:
  # near-duplicate of held-out sub13) (sub100..sub139 minus sub121): driven by the sub2 source, scored vs the real reference,
  # body-norm handles the size gap. Tests: do synthetic bodies train in a
  # source-teacher WITHOUT staging (the curriculum folds them in gradually)?
  subjectBodies: ['sub1', 'sub2', 'sub3', 'sub6', 'sub8', 'sub9', 'sub10', 'sub11', 'sub13', 'sub14', 'sub15', 'sub16', 'sub17', 'sub100', 'sub101', 'sub102', 'sub103', 'sub104', 'sub105', 'sub106', 'sub107', 'sub108', 'sub110', 'sub111', 'sub112', 'sub113', 'sub114', 'sub115', 'sub116', 'sub117', 'sub118', 'sub119', 'sub120', 'sub124', 'sub125', 'sub127', 'sub128', 'sub130', 'sub131', 'sub132', 'sub133', 'sub136', 'sub137', 'sub139']
  betas_file: scripts/omomo_betas_neutral_aug.npz
  bodyNormalizedReward: true
  subjectHeightsFile: scripts/synthetic_heights.json  # heights for sub100+ (body-norm)
  ballSize: 1.
  # MLP arm: 3230-dim single-frame obs, and NO useTransformerObs key (the
  # transformer builder requires that flag; the MLP builder must not see it).
  # This is the ONLY difference vs omomo_teacher_src2_xf_aug_lowbuf.yaml -- body
  # list, betas, PSI, reward terms and PhysX settings are all inherited unchanged,
  # so architecture is the single variable against the transformer arm.
  numObs: 3230
  rewardTerms:
    pose:
      enable: true
      lambda: 0.02
  motion_file: InterAct/OMOMO_new
  robotType: "smplx/omomo.xml"
  objectDensity: 200
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3","L_Thumb3","R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3","R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True
  physicalBufferSize: 3

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.7

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.
    op: 5.0
    or: 0.1
    opv: 0.1
    orv: 0.
    ig: 5.
    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.
    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    # 20.0 -> 12.0: the ONE change vs omomo_teacher_src2_xf_aug.yaml. See header.
    default_buffer_size_multiplier: 12.0
    max_gpu_contact_pairs: 34603008   # UNCHANGED on purpose -- lowering this drops contacts

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
