# HALF-B teacher: 7 of the 13 non-held-out OMOMO sources on the g3 geoall recipe,
# f0's 43 bodies. THREE functional edits vs g3_omomo_geoall__f0:
#
#   dataSub              sub2 sub6 sub7 sub8 sub9 sub11 sub14 (1679 clips)
#   retargetedMotionDir  the merged tree of those 7 per-source retarget trees
#   raggedMotionData     true
#
# THE SPLIT (decided 2026-09-11, for DISTILLATION into one student). The 13
# sources were partitioned into two DISJOINT halves by exhaustive search over
# all C(13,6) = 1716 choices (scripts/split_sources_balanced.py), taking the
# most clip-balanced split in which BOTH halves still cover all 13 objects:
#   half A (srchalf6, 6): sub1 532 | sub12 315 | sub15 278 | sub17 236 | sub5 172 | sub3 144
#   half B (this arm, 7): sub14 304 | sub9 293 | sub6 278 | sub11 269 | sub7 266 | sub8 217 | sub2 52
# 1677 vs 1679 clips. The perfectly even split (1678/1678) exists but gives A
# all the clothesstand clips and B all the whitechair clips; two clips of
# imbalance were judged worth full coverage. A + B = the srcall13 arm exactly.
# Thin spots to know about when reading per-object results: B has only 34
# plasticbox clips; A has only 29 smallbox and 36 monitor.
#
# WHY RAGGED HERE TOO. 43 bodies x 1679 clips padded to 652 frames (sub11's
# outlier) is 387 GiB of motion, ~796 GiB resident by the validated RAM model
# -- double the 384G the fleet reserves. Ragged it is 114 GiB (~244 resident at
# the padded model's 2.02x, ~128 if the ragged loader's factor is ~1.0 as
# designed; the srcall13 run is the calibration):
#
#   python3 scripts/motion_memory_budget.py --motion-dir InterAct/OMOMO_new \
#       --cfg isaacgym/src/intermimic/data/cfg/omomo_teacher_g3_omomo_geoall_srchalf7__f0.yaml
#
# raggedMotionData changes STORAGE only (tests/test_ragged_motion.py is
# differential against the padded assembly, including the PSI write).
#
# NO BETAS on the recipe. Everything else is the g3 recipe verbatim: obsHorizons
# [1,4,7,10,13,16], numObs 9594, geometric_all, rollout 50, initVel, PSI 3,
# pose 0.02, bodyNormalizedReward, cpuMotionData, gate resets, all four
# resetThresholds, buffer 12.0, 2048 envs via the launcher.
