# ARM B -- THE SAME RECIPE ON THE EGOEXO4D BASKETBALL RECONSTRUCTION.
# Twin of omomo_teacher_g3_omomo_nobetas__f0.yaml.
#
# THE RECIPE (identical in this arm and its twin on the other dataset):
#   obsHorizons [1,4,7,10,13,16] | numObs 9594 (6 x 1599, NO betas)
#   rewardShape geometric | rolloutLength 50 | initVel True | PSI 3
#   pose lambda 0.02 | bodyNormalizedReward | cpuMotionData
#   freeFlightGate {reward: false, resets: true}
#   resetThresholds human 0.5 | object 0.5 | igRatio 2.0 | contactSteps 10
#   stock optimizer, 2048 envs, buffer multiplier 12.0, fresh start
#
# NO BETAS CONDITIONING. With per-body contact retargeting in place, each body
# already reads a reference re-solved for its own proportions (sub16 2.7 -> 0.13
# cm), so the compensation betas used to inform is handled in the data. Body
# positions are also in the observation, so bone lengths are recoverable from it
# anyway. Whether betas add anything on top is the g3_omomo (with-betas) arm's
# job to answer -- it is the ablation, one knob from this one.
#
# DATA: the bball clip (optj3d_cf2 lineage) solved onto each of f0's 43 bodies,
# body-major, built by scripts/retarget_layout.py from the retarget job's log.
# Bodies that FAIL the solve must be named in --exclude and dropped from
# subjectBodies here too.
#
# OBJECT PHYSICS -- measured, not tuned, and NOT part of the recipe:
#   objectDensity 86   mesh volume x 200 gave 1.45 kg; a real basketball is
#                      ~0.62 kg (scripts/object_density.py --mass 0.624)
#   restitution 0.85   regulation bounce: 1.8 m drop -> 1.2-1.4 m, COR ~0.85.
#                      PhysX averages object and plane, so both are set.
#
# Dropping betas conditioning also removes a trap: the clip is sub100_bball_000.pt,
# so the task would read its SOURCE subject as 100 and find "sub100" in the OMOMO
# betas file -- which is the SYNTHETIC OMOMO body, a different person entirely.
# The lookup would have succeeded and conditioned on the wrong identity silently.
# With betas off there is nothing to look up. If betas are ever reinstated here,
# the clip must be renumbered (sub200 is free) and the CARI4D subject's SMPL-H
# betas re-fit into the 16-dim neutral SMPL-X space first.
#
# METHOD VARIANT, not an ablation: rewardShape geometric_all instead of geometric.
# Either shape could win; the winner becomes the recipe and the component
# ablations hang off it.
#
# WHAT DIFFERS. 'geometric' takes the 4th root of rb*ro*rig*rcg and then
# multiplies the pose factor in AFTERWARDS, outside the root -- an accident of
# order, since the pose term was added (2026-06-29) to a reward that was a plain
# product, where position does not matter, and the root arrived two months later
# (2026-08-27) written against the four terms it could see. In log space that
# leaves pose at coefficient 1.0 against every other leaf's 0.25:
#     log R = 0.25*(17 leaves) + 1.0*log r_pose
# 'geometric_all' takes the root over every enabled factor, putting all 18 leaves
# back on equal footing at 0.2. 'geometric' is untouched, so r7/r8/r10/r11-r14
# keep the objective they were judged on (see utils/reward_shape.py).
#
# This also makes the pose and bodyNormalizedReward ablations interpretable: on
# 'geometric' they remove a 4x-weighted factor and a rescale of one 0.25-weighted
# leaf respectively, which is not a like-for-like comparison.
