# EVAL config -- student_gen4_omomo_groups_xf_ret_nvadlr_nopose_msexp__f0: the gen4 OBJECT-GROUP student
# (4 gen4 msexp object-group teachers -> 6-token transformer, routed by the clip OBJECT).
# HAND-WRITTEN mirror of omomo_student_gen4_omomo_groups_xf_ret_nvadlr_nopose_msexp__f0.yaml: byte-identical below this block except the
# eval-owned keys (numEnvs, stateInit, enableEvaluation, rolloutLength, physicalBufferSize,
# subjectBodies) -- scripts/check_eval_cfg.py proves it. Hand-written 2026-10-17.
#
# SCORED THROUGH THE STUDENT PATH (evalEntry / evalTask): intermimic.run_distill +
# InterMimicDistillG4, the task that builds the student observation over studentObsHorizons
# and routes each env to its clip's OBJECT teacher. At eval the teacher set (teacherPolicy)
# must be present, or DISTILL_SKIP_TEACHERS=1 runs the student .pth alone (--test only).
# Read on the 13 in-distribution bodies and the held-out bodies sub4/sub10/sub13/sub16.
evalFor:
  - student_gen4_omomo_groups_xf_ret_nvadlr_nopose_msexp__f0
evalEntry: intermimic.run_distill
evalTask: InterMimicDistillG4

env:
  asset:
    assetRoot: intermimic/data/assets
  ballSize: 1.0
  bodyNormalizedReward: true
  contactBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  - L_Index3
  - L_Middle3
  - L_Pinky3
  - L_Ring3
  - L_Thumb3
  - R_Index3
  - R_Middle3
  - R_Pinky3
  - R_Ring3
  - R_Thumb3
  controlFrequencyInv: 2
  cpuMotionData: true
  raggedMotionData: true
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub1', 'sub2', 'sub3', 'sub5', 'sub6', 'sub7', 'sub8', 'sub9', 'sub11', 'sub12', 'sub14', 'sub15', 'sub17']
  enableDebugVis: false
  enableEarlyTermination: true
  enableEvaluation: True                   # eval-owned
  envSpacing: 2
  episodeLength: 300
  humanoidAssetSuffix: _inertial
  hybridInitProb: 0.1
  initVel: true
  isFlagrun: false
  keyBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  localRootObs: false
  moreRigid: false
  motionScaleReward:
    enable: true
    referenceStd: 0.5157
  motion_file: InterAct/OMOMO_new
  numEnvs: 1024                            # eval-owned: concurrency, same in every eval cfg
  numObs: 9594
  objectDensity: 200
  obsHorizons:
  - 1
  - 4
  - 7
  - 10
  - 13
  - 16
  pdControl: true
  physicalBufferSize: 1                    # eval-owned: PSI copies are identical at eval
  plane:
    dynamicFriction: 0.9
    restitution: 0.7
    staticFriction: 0.9
  playdataset: false
  powerScale: 1.0
  projtype: None
  resetThresholds:
    contactSteps: 10
    human: 0.5
    igRatio: 2.0
    object: 0.5
  retargetedMotionDir: InterAct/OMOMO_retarget_contact_srcall13
  rewardShape: geometric_all
  rewardTerms:
    freeFlightGate:
      resets: true
      reward: false
    pose:
      enable: false
      lambda: 0.02
  rewardWeights:
    cg_all: 3.0
    cg_hand: 5.0
    cg_other: 5.0
    eg1: 2.0e-05
    eg2: 2.0e-05
    eg3: 1.0e-09
    ig: 5.0
    op: 5.0
    opv: 0.1
    or: 0.1
    orv: 0.0
    p: 30.0
    pv: 0.0
    r: 2.5
    rv: 0.0
  robotType: smplx/omomo.xml
  rolloutLength: 1000                      # eval-owned: the uniform eval window (> every clip)
  saveImages: false
  stateInit: "Start"                       # eval-owned: metrics exist only in Start
  subjectBodies: ['sub2']                  # placeholder: every pair overrides it via --subject_bodies
  subjectHeightsFile: scripts/synthetic_heights_gen4.json
  terminationHeight: 0.15
  # --- distillation (InterMimicDistillG4: routed by the clip's OBJECT) ---
  teacherPolicy: checkpoints/teachers/gen4_omomo_groups_msexp
  teacherPolicyCFG: intermimic/data/cfg/train/rlg/omomo_teacher_gen4_omomo_geoall_chairs_xf_nvadlr_nopose_msexp__f0.yaml
  studentObsHorizons: [1, 4, 7, 10, 13, 16]
  numObsRetarget: 9594
sim:
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
  physx:
    bounce_threshold_velocity: 0.2
    contact_offset: 0.02
    default_buffer_size_multiplier: 12.0
    max_depenetration_velocity: 100.0
    max_gpu_contact_pairs: 34603008
    num_position_iterations: 4
    num_threads: 4
    num_velocity_iterations: 1
    rest_offset: 0.0
    solver_type: 1
  substeps: 2
