# THE g3 RECIPE ON THE EGOEXO4D SOCCER RECONSTRUCTION, THE 7 PEOPLE WITH THE
# MOST CLIPS. Twin of omomo_teacher_g3_soccer15_geoall__f0.yaml; ONE key
# differs (python3 scripts/cfg_diff.py the two files):
#
#   dataSub   sub405 15 | sub487 8 | sub482 6 | sub490 6 | sub485 5 | sub484 4 | sub493 3
#             = 47 clips (the 15-person arm has 61)
#
# TIE FOR 7TH: sub493, sub495 and sub496 all have 3 clips; sub493 is in by
# lowest id. Swapping it for either other (or taking all three: 9 people, 53
# clips) is a one-line change here + the `for s in` guard in the launcher.
# Padded storage 2021 motions x 677 frames ~ 12.1 GB -> ~37 GiB RSS.
#
# Same converted data, same merged retarget tree (the task opens only the
# (body, clip) files dataSub selects), same ball physics, same 43 bodies.
# Everything else: see the soccer15 header. Jess (2026-09-13): both arms,
# 15 people and the top-7 by clip count, matching bball7's 7-person framing.
