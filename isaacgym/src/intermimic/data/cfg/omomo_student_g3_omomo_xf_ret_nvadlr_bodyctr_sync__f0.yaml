# ARM A: the omomo XF student + the BODY WIRE (each env's 52 bone offsets, 156-d, appended to the student obs; adaLN in every encoder layer + a bypass into the action head) + the CONTRASTIVE TWIN term (envs e and e+13 run the same clip/start frame on different bodies; InfoNCE on the trunk pulls the pair together).
# BODYCTR_SYNC = bodyctr + twinCoReset. Same Arm A, ONE key added: a twin pair
# resets as a unit (utils/distill_g3.twin_coreset), so the pair stays on the
# same clip/frame for whole episodes. In bodyctr the pair only re-synced when
# both envs happened to reset in the same batch; measured 2026-09-19 at ~5%
# valid pairs per rollout on the act bodyctr arm, i.e. the contrastive term saw
# only the first frames after a coincidental joint reset. Expect >90% valid here
# ([distill] twin pairs valid line in the log is the check). The partner is a
# truncation, never a termination (_terminate_buf untouched).
# Env = omomo_student_g3_omomo_xf_ret_nvadlr_bodyctr__f0.yaml BYTE-FOR-BYTE except twinCoReset true; that one
# = omomo_student_g3_omomo_xf_ret_nvadlr__f0.yaml except studentBodyFeatures true, twinEnvs true,
# numObsRetarget 9750 = 6 x 1599 + 156 body dims. Same data, same 13 teachers, same recipe
# -> read at a matched epoch against bodyctr AND the plain omomo XF student on sub10/13/16.
# See utils/body_features.py and the train cfg for the knobs; tests/test_arm_a_cfgs.py pins the diff.
