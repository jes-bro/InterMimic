# gen4 EGOEXO TEACHER gen4_bball7_geoall_xf_nvadlr_nopose_msexp__f0: the g3 bball7 transformer teacher
# on the gen4 bodies and the motion-scale reward. This file is g3_bball7_geoall_xf_nvadlr_nopose__f0's env cfg with
# exactly these edits (python3 scripts/cfg_diff.py the two files; pinned by
# tests/test_gen4_egoexo_teacher_cfgs.py):
#   subjectHeightsFile  -> scripts/synthetic_heights_gen4.json
#   subjectBodies       -> 13 fold-0 training reals + sub600..sub629 (43 bodies;
#                          held out: sub4 sub10 sub13 sub16)
#   humanoidAssetSuffix -> _inertial  (explicit link inertials: the stock files trip a PhysX
#                          joint-angle rollover on ~1 body in 10)
#   motionScaleReward   -> enable, referenceStd 0.5157 (utils/motion_scale.py: the 4th root
#                          becomes a per-clip exponent clamp((ref/std)^2, 1/4, 1); basketball's
#                          median motion 1.02 m sits at the root, OMOMO-sized clips at PRODUCT)
# Recipe otherwise unchanged: geometric_all reward, no pose term, 6 obs horizons,
# retargeted references (the arm's tree must hold sub600-629 -- see the generator's
# docstring for the retarget + merge commands), PSI 3, body-normalised reward.
