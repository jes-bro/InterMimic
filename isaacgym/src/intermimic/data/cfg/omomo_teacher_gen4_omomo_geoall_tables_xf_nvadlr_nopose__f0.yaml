# gen4 OBJECT-GROUP TEACHER gen4_omomo_geoall_tables_xf_nvadlr_nopose__f0: every OMOMO clip whose object is one of
#   largetable smalltable
# from the 13 fold-0 training sources, on the gen4 bodies. This file is the gen4 src1
# nopose transformer teacher's env cfg (gen4_omomo_geoall_src1_xf_nvadlr_nopose__f0) with exactly four edits
# (python3 scripts/cfg_diff.py the two files; pinned by tests/test_gen4_activity_teacher_cfgs.py):
#   dataSub             -> the 13 training sources (held out: sub4 sub10 sub13 sub16)
#   dataObjects         -> the group (intermimic.py keeps only these objects' clips)
#   raggedMotionData    -> true (per-clip storage; see scripts/make_gen4_activity_teacher_cfgs.py)
#   retargetedMotionDir -> InterAct/OMOMO_retarget_contact_srcall13 (merged 13-source tree, must hold sub600-629)
# Sampling unchanged: env e owns object e % n_obj, uniform clips within the object.
# Recipe otherwise the gen4 fleet's: geometric_all reward, no pose term, 6 obs horizons,
# retargeted references, PSI 3, body-normalised reward, _inertial MJCFs, 43 bodies.
