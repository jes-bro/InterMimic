  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  localRootObs: false
  moreRigid: false
  motion_file: InterAct/behave_cari4d_optj3d_cf2
  numEnvs: 4096
  numObs: 9594
  objectDensity: 86
  objectShapeProps:
    restitution: 0.85
  obsHorizons:
