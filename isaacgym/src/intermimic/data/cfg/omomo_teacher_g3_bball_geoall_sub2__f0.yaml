# BBALL OVERFIT with geometric_all -- the SINGLE-BODY twin of g3_bball_geoall__f0.
#
# ONE functional edit vs that arm: subjectBodies 43 bodies -> ['sub2'].
# Everything else is byte-identical -- geometric_all, obsHorizons [1,4,7,10,13,16],
# numObs 9594 (no betas), freeFlightGate {reward: false, resets: true}, all four
# resetThresholds live, rolloutLength 50, initVel true, PSI 3, bball object
# physics (density 86, restitution 0.85 on object AND plane), and the SAME
# body-major retarget tree, which already contains sub2.
#
# WHY ONE BODY. The multi-body arm asks whether the recipe transfers across 43
# bodies at once; this asks whether it can fit the clip AT ALL on the body the
# r-series ladder used. A failure here is a recipe failure; a failure only in the
# multi-body arm is a cross-body failure. Keeping the diff to a single key is
# what makes that distinction readable.
#
# NOTE this is NOT r12. r12 turns the object-side resets OFF entirely
# (object/igRatio/contactSteps all false); this keeps all four live and lets the
# free-flight gate handle the ballistic frames, which is the g3 recipe.
env:
  asset:
    assetRoot: intermimic/data/assets
  ballSize: 1.0
  bodyNormalizedReward: true
  contactBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  - L_Index3
  - L_Middle3
  - L_Pinky3
  - L_Ring3
  - L_Thumb3
  - R_Index3
  - R_Middle3
  - R_Pinky3
  - R_Ring3
  - R_Thumb3
  controlFrequencyInv: 2
  cpuMotionData: true
  dataFPS: 30
  dataFramesScale: 1
  dataSub:
  - sub100
  enableDebugVis: false
  enableEarlyTermination: true
  envSpacing: 2
  episodeLength: 300
  hybridInitProb: 0.1
  initVel: true
  isFlagrun: false
  keyBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
