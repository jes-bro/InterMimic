# V1 eval config -- for PRE-GEN-2 checkpoints ONLY.
#
# This file was `omomo_test_multibody.yaml`. It began as a chunk-1 multi-body
# SMOKE TEST (verify per-env asset loading: same policy, same motion, several
# bodies in parallel) and was then adopted as the shared eval template for every
# checkpoint. Renamed on 2026-09-04 so it can no longer be mistaken for a default.
#
# WHAT WENT WRONG. As a shared template it silently supplied its OWN value for
# every feature added to the task after it was written. It has no
# retargetedMotionDir, so every gen-2 retargeting arm was scored against the
# UN-retargeted reference -- a different target than it trained to track. It has
# no rewardTerms.freeFlightGate, so a gen-3 arm would have had object and igRatio
# resets firing on reference free-flight frames (measured: ~0%% success for a
# policy that completes the clip). It has no obsHorizons, so a multi-horizon arm
# cannot load against it at all. It carries gendered betas, a student-eval
# dataObjects leftover, and the PhysX buffer multiplier that OOM'd at 44.3/44G.
#
# DO NOT USE IT FOR A GEN-2 OR GEN-3 ARM. Those have their own configs --
# cfg/omomo_eval_g2_*.yaml and cfg/omomo_eval_g3_*.yaml -- resolved by
# `scripts/check_eval_cfg.py --arm <arm>`, which also re-proves that each one
# still mirrors its arm. An arm with no eval config is an error, not a fallback.
#
# IT IS STILL CORRECT for the v1 checkpoints it predates and matches: the
# smplx_multibody_* baselines, the distilled students, and the crosspair
# teachers, all of which trained in exactly this environment. That is the only
# reason it was renamed rather than deleted.
#
# THIS FILE: numObs 3230 (MLP, 2 stock horizons + 32 betas).
env:
  numEnvs: 16
  envSpacing: 2
  episodeLength: 1000
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: False
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Start"
  rolloutLength: 1000
  hybridInitProb: 0.5
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub2']                        # patched per-subject by eval_per_subject.py
  subjectBodies: ['sub2']                  # patched per-subject by eval_per_subject.py
  dataObjects: ['largetable', 'woodchair'] # restrict to objects the students were trained on
  betas_file: scripts/omomo_betas.npz      # match training obs structure
  ballSize: 1.
  numObs: 3230                             # 3198 base + 32 betas (must match training checkpoint)
  motion_file: InterAct/OMOMO_new
  robotType: "smplx/omomo.xml"             # fallback only; ignored when subjectBodies is set
  objectDensity: 200
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3","L_Thumb3","R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3","R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True
  enableEvaluation: True

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.7

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.

    op: 5.0
    or: 0.1
    opv: 0.1
    orv: 0.

    ig: 5.

    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.

    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 20.0
    max_gpu_contact_pairs: 34603008

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
