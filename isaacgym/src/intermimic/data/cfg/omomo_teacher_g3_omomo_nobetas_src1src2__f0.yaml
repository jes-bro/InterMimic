# SOURCE-DIVERSITY control: TWO sources (sub1 + sub2), 584 clips.
#
# TWO functional edits vs g3_omomo_nobetas__f0 -- and they are one change, not two:
#   dataSub             ['sub2'] -> ['sub1', 'sub2']
#   retargetedMotionDir src2 tree -> the MERGED tree
#
# The second follows from the first. Retargeting is solved per SOURCE, so each
# tree holds one source's clips laid out by target body
# (<dir>/<body>/sub<SRC>_<obj>_<idx>.pt). The task reads exactly ONE directory
# (intermimic.py:302-334), so an arm loading 2 sources needs both sources' clips
# under each body. Build it with scripts/merge_retarget_trees.py -- a symlink
# farm over the existing per-source trees, no re-solving:
#
#   python3 scripts/merge_retarget_trees.py \
#     --sources InterAct/OMOMO_retarget_contact_src1 \
#               InterAct/OMOMO_retarget_contact_src2 \
#     --out InterAct/OMOMO_retarget_contact_src1src2 \
#     --bodies-from isaacgym/src/intermimic/data/cfg/omomo_teacher_g3_omomo_nobetas_src1src2__f0.yaml
#
# WHAT THIS ASKS. Paired with g3_omomo_nobetas_src1__f0, this isolates source
# DIVERSITY from source QUANTITY -- the two things every other multi-source arm
# changes at once:
#
#   g3_omomo_nobetas_src1__f0   sub1        532 clips   1 source
#   THIS ARM                    sub1+sub2   584 clips   2 sources   (+10% clips)
#
# A 10% clip difference against a doubling of the source count. If this beats
# src1, the gain is diversity rather than data volume; if it does not, the
# multi-source story is really a more-data story, and the src26/src269/srctop3
# ladder should be read that way.
#
# MEMORY: 584 x 43 = 25112 per-body references, ~155 GB resident (hoi_data plus
# 3x hoi_refs under PSI 3), so the slurm script asks for 224G. That is CPU RAM,
# not VRAM -- cpuMotionData keeps these tensors on the host (intermimic.py:864).
#
# NO BETAS. With betas_file absent, _use_betas_obs is False, so the 32-dim
# (source_betas, target_betas) block is NEVER concatenated into the observation
# (intermimic.py:1574-1581) -- numObs 9594 here against 9626 on the betas arm.
# source_betas IS still allocated, as zeros (line 388), but nothing ever reads
# it: both call sites are guarded by _use_betas_obs. So changing the source set
# cannot shift the conditioning vector, because there is no conditioning vector
# to shift. On a betas arm there would be, and the comparison against the
# single-source rung would not be clean.
