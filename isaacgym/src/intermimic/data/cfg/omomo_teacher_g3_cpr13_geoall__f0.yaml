# THE g3 RECIPE ON THE EGOEXO4D CPR RECONSTRUCTION, ALL 13 PEOPLE.
# Twin of omomo_teacher_g3_bball7_geoall__f0.yaml. What differs, and only this
# (python3 scripts/cfg_diff.py the two files):
#
#   motion_file           InterAct/behave_cari4d_cpr_kn     23 clips, 13 people
#   dataSub               sub509 510 512 513 517 564 565 566 567 569 577 579 580
#   retargetedMotionDir   the merged 13-source tree, f0's 43 bodies, body-major
#   objectMass 3.7        a torso-and-head training manikin (Little Anne class);
#                         the recon meshes are 0.64 m (UTokyo) / 0.5 m (NUS)
#                         torsos, not full bodies (bball: 0.624 kg ball)
#   objectShapeProps      REMOVED -> the task's defaults, restitution 0.05 and
#                         friction 0.6, i.e. what every OMOMO object gets
#   plane.restitution 0.7 the OMOMO value (bball raised both to 0.85 for bounce)
#
# THE DATA (2026-09-14). CARI4D reconstructions of EgoExo4D CPR takes: 23
# clips from 13 CARI4D Sub ids, verified 13 distinct EgoExo4D participants via
# takes.json (5 NUS, 8 UTokyo). Subject id = 400 + Sub. One body per person =
# MEDIAN over that person's solves (mean differs by <= 0.11 -- same as soccer).
# Clips 78-691 frames (~6.1k total), none under rolloutLength 50.
#
# THE OBJECT NEVER MOVES. That changes what the reward terms mean, not the
# recipe: op grades the human's placement relative to the manikin (root-
# relative, so not constant); opv grades "do not shove it"; the ig term is the
# main signal (hands where the reference puts them on the chest); rcg_hand
# grades the compression contact. resetThresholds.object 0.5 is kept as the
# "don't shove it" guard. The reference puts the hands ~5 cm INSIDE the chest
# on every compression (real manikins compress; a rigid mesh does not) --
# accepted: PhysX resolves the penetration and hand pose error carries a
# floor of a few cm on those frames. objectConvexHull true is a good shape
# for a torso (near-convex; hull is 1.2-1.4x the raw volume).
#
# CONTACT LABELS: the converter's own vertex-distance labels, which are
# correct for a static object; the hand/foot relabel scripts (sphere model)
# were NOT run. The one fix is scripts/relabel_contact_cpr.py: the kneeler's
# knees/ankles/toes rest on the FLOOR > 10 cm from the manikin and were
# labelled "must not touch"; they are set to neutral (_kn). Floor seating
# uses the lowest of all bodies (knees), rotate_pt.py --floor-bodies all.
#
# BODIES: f0's 43 OMOMO bodies (sub10 sub13 sub16 held out). Padded storage:
# 989 motions x 691 frames x 8.8 kB ~ 6 GB; no ragged flag; 64G.
#
# Recipe verbatim: obsHorizons [1,4,7,10,13,16], numObs 9594, no betas,
# geometric_all, rollout 50, initVel, PSI 3, pose 0.02, bodyNormalizedReward,
# cpuMotionData, gate resets, all four resetThresholds, buffer 12.0, 2048 envs.
