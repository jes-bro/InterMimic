# EVAL config -- g3_omomo_nobetas_src1src2__f0 (2 sources: sub1, sub2; 584 clips).
# Mirrors omomo_teacher_g3_omomo_nobetas_src1src2__f0.yaml. One file, one arm.
#
# It cannot share either single-source eval config: retargetedMotionDir is NOT
# eval-owned, and this arm reads the MERGED tree. Pointing it at the src1 or the
# src2 tree alone would raise FileNotFoundError on the other source's clips.
#
# dataSub carries both sources rather than a single placeholder, because
# eval_one.sh takes SOURCES from the ARM's train cfg and sweeps body x source.
# The value here is overwritten per pair on the command line either way; what
# matters is that the tree beneath it covers every source the sweep will ask for.
#
# READ IT PER SOURCE. Paired with omomo_eval_g3_omomo_nobetas_src1__f0, this arm
# answers whether source DIVERSITY buys anything at near-fixed clip count (584
# against 532, i.e. +10% data for 2x the sources). Compare each source's column
# separately -- an aggregate over sources hides one collapsing while the other
# improves.
#
# THIS TREE COVERS BOTH SOURCES, which makes this the one config in the family
# that can run a CONTROLLED cross-arm comparison: --data_sub sub2 scores this
# arm on exactly the 52 clips the sub2 rung was scored on, at exactly the same
# attempts-per-clip budget. The single-source eval configs cannot, their trees
# holding one source each. When the src1-vs-sub2 read comes out ambiguous, this
# is the config that resolves it.
#
# SCORING BUDGET: success is best-of-N attempts per CLIP and the denominator is
# the clip count (intermimic.py:1685-1704), so attempts per clip scale as
# envs/clips. A full 584-clip sweep is scored ~11x harder per clip than the
# 52-clip sub2 rung at the same numEnvs; a --data_sub sub2 sweep is not. See
# omomo_eval_g3_omomo_nobetas_src1__f0.yaml for the full note.
#
# Every other key, and every eval-owned override, is as in the single-source
# eval config (omomo_eval_g3_omomo_nobetas__f0.yaml); the reasons are there.
evalFor:
  - g3_omomo_nobetas_src1src2__f0

env:
  numEnvs: 2048                            # NOT a free knob, and NOT a placeholder.
                                           # Success is the BEST attempt per CLIP:
                                           # _max_execution_steps is indexed by
                                           # seq_id and is a running MAXIMUM, and the
                                           # denominator is the clip count, not the
                                           # env count (intermimic.py:1685-1703). So
                                           # more envs = more attempts per clip = a
                                           # success rate that can only rise and pose
                                           # errors that can only fall. It must be
                                           # IDENTICAL across every arm compared.
                                           # 2048 = the count all 30 g2/g3 arms
                                           # actually trained at (the launchers pass
                                           # --num_envs "${NUM_ENVS:-2048}", which
                                           # overrides the 4096 in their train yamls).
                                           # NOTE: eval CSVs written before 2026-09-04
                                           # used 1024 and are NOT comparable to these.
  envSpacing: 2
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: True
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Start"
  enableEvaluation: True
  rolloutLength: 1000
  physicalBufferSize: 1
  hybridInitProb: 0.1
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub1', 'sub2']                # all sources; overwritten per pair by --data_sub
  subjectBodies: ['sub2']                  # patched per pair by eval_per_pair.py
  retargetedMotionDir: InterAct/OMOMO_retarget_contact_src1src2
  cpuMotionData: true
  subjectHeightsFile: scripts/synthetic_heights.json
  bodyNormalizedReward: true
  ballSize: 1.
  numObs: 9594                             # 6 horizons x 1599, no betas block
  obsHorizons: [1, 4, 7, 10, 13, 16]
  motion_file: InterAct/OMOMO_new
  robotType: "smplx/omomo.xml"             # fallback only; ignored when subjectBodies is set
  objectDensity: 200
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3","L_Thumb3","R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3","R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True

  resetThresholds:
    human: 0.5
    object: 0.5
    igRatio: 2.0
    contactSteps: 10

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.7

  rewardShape: geometric

  rewardTerms:
    pose:
      enable: true
      lambda: 0.02
    freeFlightGate:
      reward: false
      resets: true

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.

    op: 5.0
    or: 0.1
    opv: 0.1
    orv: 0.

    ig: 5.

    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.

    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 12.0
    max_gpu_contact_pairs: 34603008

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
