# ARM A -- THE RECIPE ON OMOMO. f0's 43 bodies, OMOMO retargeted references.
# Twin of omomo_teacher_g3_bball__f0.yaml: diff them with scripts/cfg_diff.py and
# only the motion data and the object's measured physical properties differ.
#
# THE RECIPE (identical in this arm and its twin on the other dataset):
#   obsHorizons [1,4,7,10,13,16] | numObs 9594 (6 x 1599, NO betas)
#   rewardShape geometric | rolloutLength 50 | initVel True | PSI 3
#   pose lambda 0.02 | bodyNormalizedReward | cpuMotionData
#   freeFlightGate {reward: false, resets: true}
#   resetThresholds human 0.5 | object 0.5 | igRatio 2.0 | contactSteps 10
#   stock optimizer, 2048 envs, buffer multiplier 12.0, fresh start
#
# NO BETAS CONDITIONING. With per-body contact retargeting in place, each body
# already reads a reference re-solved for its own proportions (sub16 2.7 -> 0.13
# cm), so the compensation betas used to inform is handled in the data. Body
# positions are also in the observation, so bone lengths are recoverable from it
# anyway. Whether betas add anything on top is the g3_omomo (with-betas) arm's
# job to answer -- it is the ablation, one knob from this one.
#
# rolloutLength 50 is not a preference. Start sampling is
# randint(0, max(1, T - rolloutLength)) (intermimic.py:1269); at 300, 8538 of 8842
# OMOMO clips (96.6%) could only ever start at frame 0, making stateInit Hybrid
# silently equal to Start, and PSI harvests only where T >= R (psi_update.py:104)
# so it was inert on 96% of the data. At 50 nothing is pinned, every clip is
# PSI-eligible, and the ceiling across all motion dirs is 60.
#
# TERMINATIONS: all four criteria live, object + igRatio gated on reference
# contact. Measured 2026-09-02 on r8's converged policy, one at a time:
#   object 0.5 alone 23 steps/0% (fatal) | igRatio 2.0 alone 96-99 steps/0%
#   (kills at the layup) | contactSteps 10 alone 100 steps/100% (free)
#   all four live + object/ig gated: 100 steps, 100%, reward 13.4
# Confirmed on retargeted references too (r12: 100 steps/100%, reward 13.61 vs
# 13.58 ungated). freeFlightGate.reward stays FALSE -- r8 trains without it and
# r3's breakdown refuted it (ro flat across the contact split, .538 vs .580).
#
# Baseline: smplx_teacher_g2_mlp_ret_stock__f0 (same data, bodies, optimizer, envs).
