params:
  seed: -1

  algo:
    name: intermimic

  model:
    name: intermimic

  network:
    name: intermimic_transformer
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False

  config:
    name: mimic
    # SOURCE-TEACHER: adaptive-LR A/B. Identical to src2_xf_aug EXCEPT lr_schedule=adaptive + kl_threshold added.
    # _adlr2: renamed from _adlr so auto-resume can NEVER pick up a checkpoint
    # from an earlier attempt with the broken kl_threshold 0.008 calibration.
    full_experiment_name: smplx_teacher_src2_xf_aug_adlr2
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: adaptive         # <-- was 'constant'; adapts LR to keep KL near kl_threshold
    # kl_threshold is calibrated to the EXACT-KL scale (see exact_policy_kl in
    # learning/common_agent.py; the biased rl_games estimator is not used).
    # Healthy epochs at LR 2e-5 measure exact-KL ~= 0.06 over the 153-dim action
    # space, so 0.06 keeps LR steady in the stable regime (band 0.03-0.12) and
    # slams it down on blowup epochs. Do NOT use rl_games' 0.008 default here --
    # that scale assumes both the (biased) stock estimator and a much smaller
    # action space. With the stock estimator (bias ~-0.25) ANY threshold breaks:
    # the scheduler would see kl < threshold/2 always and ratchet LR to 1e-2.
    kl_threshold: 0.06
    score_to_win: 20000
    max_epochs: 100000
    save_best_after: 100
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False
    save_intermediate: True
    resume_from: 'None'
