params:
  seed: -1

  algo:
    name: intermimic

  model:
    name: intermimic

  network:
    name: intermimic
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  # load_checkpoint: True
  load_checkpoint: False

  config:
    name: mimic
    # OVERFIT diagnostic on the EgoExo4D bball reconstruction. Train cfg is the
    # STOCK upstream teacher config (constant 2e-5, normalize_value False, MLP
    # [1024,1024,512]) -- the optimizer every released InterMimic teacher used.
    # Deliberately NOT the normval+adlr recipe: that recipe has only been proven
    # on the transformer, and a diagnostic run should not carry an untested
    # optimizer combination in its suspect list. 4096 envs x 32 horizon = 131072
    # = 8 minibatches of 16384.
    full_experiment_name: smplx_cari4d_bball_rectinj3_warm
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 100000
    save_best_after: 500
    save_frequency: 500
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    ppo: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False
    # EXPLICIT warm start (Jess 2026-08-17) -- NOT a silent default. The slurm
    # script rewrites this line to the run's OWN mimic.pth on resubmits.
    resume_from: checkpoints/smplx_teachers_new/sub2.pth
    save_intermediate: False