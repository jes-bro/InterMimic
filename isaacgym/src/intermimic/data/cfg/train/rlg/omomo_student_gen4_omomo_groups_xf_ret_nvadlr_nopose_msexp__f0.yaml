# STUDENT train cfg for student_gen4_omomo_groups_xf_ret_nvadlr_nopose_msexp__f0: byte-identical to the g3 OMOMO XF student's
# (train/rlg/omomo_student_g3_omomo_xf_ret_nvadlr__f0.yaml) except full_experiment_name. 6-token transformer,
# normalize_value + adaptive LR (exact-KL 0.06), expert_loss_coef 1, save_intermediate on.
# Generated by scripts/make_gen4_student_cfgs.py.
params:
  algo:
    name: intermimic
  config:
    bounds_loss_coef: 10
    clip_value: false
    critic_coef: 5
    e_clip: 0.2
    enable_eps_greedy: false
    entropy_coef: 0.0
    env_name: rlgpu
    expert_loss_coef: 1
    full_experiment_name: smplx_student_gen4_omomo_groups_xf_ret_nvadlr_nopose_msexp__f0
    gamma: 0.99
    grad_norm: 1.0
    horizon_length: 16
    # kl_threshold on the EXACT-KL scale (learning/common_agent.py exact_policy_kl,
    # used by the distill agent too): ~0.06 is the healthy-epoch KL at LR 2e-5 over
    # 153 action dims, so it holds LR steady and slams the blowup epochs.
    kl_threshold: 0.06
    learning_rate: 2e-5
    lr_schedule: adaptive
    max_epochs: 100000
    mini_epochs: 6
    minibatch_size: 8192
    mixed_precision: false
    multi_gpu: false
    name: mimic
    normalize_advantage: true
    normalize_input: true
    normalize_value: true
    ppo: true
    print_stats: true
    resume_from: None
    reward_shaper:
      scale_value: 1
    save_best_after: 500
    save_frequency: 1000
    save_intermediate: true
    score_to_win: 20000
    seq_len: 4
    tau: 0.95
    truncate_grads: false
  load_checkpoint: false
  model:
    name: intermimic
  network:
    mlp:
      activation: relu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
      units:
      - 1024
      - 1024
      - 512
    name: intermimic_transformer
    separate: true
    space:
      continuous:
        fixed_sigma: true
        learn_sigma: false
        mu_activation: None
        mu_init:
          name: default
        sigma_activation: None
        sigma_init:
          name: const_initializer
          val: -2.9
    transformer:
      num_tokens: 6
      readout_token: 0
  seed: -1
