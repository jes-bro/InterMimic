params:
  seed: -1

  algo:
    name: intermimic

  model:
    name: intermimic

  network:
    name: intermimic
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  # load_checkpoint: True
  load_checkpoint: False

  config:
    name: mimic
    # OVERFIT diagnostic on the EgoExo4D bball reconstruction. Train cfg is the
    # STOCK upstream teacher config (constant 2e-5, normalize_value False, MLP
    # [1024,1024,512]) -- the optimizer every released InterMimic teacher used.
    # Deliberately NOT the normval+adlr recipe: that recipe has only been proven
    # on the transformer, and a diagnostic run should not carry an untested
    # optimizer combination in its suspect list. 4096 envs x 32 horizon = 131072
    # = 8 minibatches of 16384.
    full_experiment_name: smplx_cari4d_bball_r3_roll30_fresh
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 100000
    save_best_after: 500
    save_frequency: 500
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    ppo: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False
    # NO WARM START -- this is the control. Every bball arm since r2 inherited
    # its warm start from omomo.yaml, InterMimic's OWN default, without anyone
    # choosing it. That teacher's entire experience is subject 2 doing ~0.5
    # m/s tabletop manipulation; this clip is 1.98 m/s median, 7.33 m/s peak,
    # on a different body.
    #
    # The one controlled pair that exists says the prior HURTS. rectinj3 and
    # rectinj3_warm are identical apart from this line, and at comparable
    # own-epochs the FRESH run scored 1.48 against the warm run's 0.57 --
    # while training longer (9,944 own epochs vs ~10,629). That pair ran on
    # behave_cari4d_rectinj3, so it does not settle the CURRENT data, which
    # is exactly what this arm is for.
    #
    # The slurm script still rewrites this line to the run's OWN mimic.pth on
    # resubmits -- resuming your own checkpoint is not a warm start.
    resume_from: 'None'
    save_intermediate: False