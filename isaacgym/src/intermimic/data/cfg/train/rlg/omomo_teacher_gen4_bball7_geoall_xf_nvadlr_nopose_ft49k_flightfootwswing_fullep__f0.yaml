# FINE-TUNE arm (flightfootwswing): DERIVED from the gen4_bball7_geoall_xf_nvadlr_nopose_msexp__f0 train cfg by scripts/make_finetune_cfgs.py.
# Starts from that teacher's checkpoint at epoch 49000 (checkpoints/smplx_teacher_gen4_bball7_geoall_xf_nvadlr_nopose_msexp__f0/nn/mimic_00049000.pth) and
# continues under: full episodes (rolloutLength 1000 + minEpisodeFrames 30); objectFlightReward {rootFlight 0.6, flatFlight 0.0} in place of motionScaleReward; rewardTerms.footWeight {weight 5.0}; rewardTerms.footSwing {lambda 50.0}.
# Nothing else differs (pinned by tests/test_finetune_cfgs.py). A WARM START from another run's
# checkpoint, Jess 2026-10-20, for the Nov 10 deadline: reported as 'trained, then fine-tuned'.
params:
  algo:
    name: intermimic
  config:
    bounds_loss_coef: 10
    clip_value: false
    critic_coef: 5
    e_clip: 0.2
    enable_eps_greedy: false
    entropy_coef: 0.0
    env_name: rlgpu
    full_experiment_name: smplx_teacher_gen4_bball7_geoall_xf_nvadlr_nopose_ft49k_flightfootwswing_fullep__f0
    gamma: 0.99
    grad_norm: 1.0
    horizon_length: 32
    # exact-KL scale (learning/common_agent.py exact_policy_kl): ~0.06 is the
    # healthy-epoch KL at LR 2e-5 over 153 action dims.
    kl_threshold: 0.06
    learning_rate: 2e-5
    lr_schedule: adaptive
    max_epochs: 100000
    mini_epochs: 6
    minibatch_size: 16384
    mixed_precision: false
    multi_gpu: false
    name: mimic
    normalize_advantage: true
    normalize_input: true
    normalize_value: true
    ppo: true
    print_stats: true
    resume_from: 'checkpoints/smplx_teacher_gen4_bball7_geoall_xf_nvadlr_nopose_msexp__f0/nn/mimic_00049000.pth'
    reward_shaper:
      scale_value: 1
    save_best_after: 100
    save_frequency: 1000
    save_intermediate: true
    score_to_win: 20000
    seq_len: 4
    tau: 0.95
    truncate_grads: false
  load_checkpoint: false
  model:
    name: intermimic
  network:
    mlp:
      activation: relu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
      units:
      - 1024
      - 1024
      - 512
    name: intermimic_transformer
    separate: true
    space:
      continuous:
        fixed_sigma: true
        learn_sigma: false
        mu_activation: None
        mu_init:
          name: default
        sigma_activation: None
        sigma_init:
          name: const_initializer
          val: -2.9
    transformer:
      num_tokens: 6
      readout_token: 0
  seed: -1
