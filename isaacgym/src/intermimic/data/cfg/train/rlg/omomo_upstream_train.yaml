# UPSTREAM InterMimic training recipe, rl_games side: intermimic/data/cfg/train/rlg/omomo.yaml as shipped by
# the original release (git show $(git rev-list --max-parents=0 HEAD | tail -1):intermimic/data/cfg/train/rlg/omomo.yaml).
# Checked in UNCHANGED as the base of the InterMimic BASELINE teachers (scripts/make_intermimic_baseline_cfgs.py):
# MLP 1024-1024-512, constant LR 2e-5, no value normalisation, horizon 32, minibatch 16384. Note its
# resume_from points at upstream's shared init checkpoint (omomo/init/nn/mimic.pth), which we do not have;
# the baseline arms train from scratch (resume_from None). Never run as-is.
params:
  seed: -1

  algo:
    name: intermimic

  model:
    name: intermimic

  network:
    name: intermimic
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  # load_checkpoint: True
  load_checkpoint: False

  config:
    name: mimic
    full_experiment_name: init
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 100000
    save_best_after: 500
    save_frequency: 500
    print_stats: False
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    ppo: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False
    resume_from: omomo/init/nn/mimic.pth
    save_intermediate: False