params:
  seed: -1

  algo:
    name: intermimic

  model:
    name: intermimic

  network:
    name: intermimic_transformer
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False

  config:
    name: mimic
    # SPEED ARM: identical to omomo_teacher_src2_xf_aug EXCEPT learning_rate 2e-5 -> 4e-5.
    # Rationale: the adaptive-LR arms settle at ~1.1e-5 and learn SLOWER than the
    # constant-2e-5 baseline, i.e. in this regime more LR = faster. The no-normval
    # constant config is the empirically blowup-free family (zero KL spikes over
    # 18k epochs), so raising its LR is the low-risk way to buy speed.
    # Single knob vs the baseline; normalize_value stays False, schedule stays constant.
    full_experiment_name: smplx_teacher_src2_xf_aug_lr4
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 4e-5     # <-- the ONE change vs src2_xf_aug (was 2e-5)
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 100000
    save_best_after: 100
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False
    save_intermediate: True
    resume_from: 'None'
