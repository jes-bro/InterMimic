# STUDENT train cfg, SRC1 (the single sub1 g3 teacher (the ablation base source)), MLP / RET / STOCK (DAgger via intermimic.run_distill).
# Network = the g3 teachers' MLP 1024/1024/512 verbatim. Optimizer = STOCK:
# constant LR 2e-5, normalize_value false (the g3 teacher recipe). Batch
# geometry (horizon 16, minibatch 8192, mini_epochs 6, expert_loss_coef 1) is
# the codebase's student recipe (omomo_distill_both / omomo_all_source_xf_aug),
# the only geometry the DAgger beta schedule (agent_distill.py:78) has run with;
# the teachers' 32/16384 is a PPO-only setting. save_intermediate on so every
# 500-epoch snapshot can be evaluated.
params:
  algo:
    name: intermimic
  config:
    bounds_loss_coef: 10
    clip_value: false
    critic_coef: 5
    e_clip: 0.2
    enable_eps_greedy: false
    entropy_coef: 0.0
    env_name: rlgpu
    expert_loss_coef: 1
    full_experiment_name: smplx_student_g3_src1_mlp_ret_stock__f0
    gamma: 0.99
    grad_norm: 1.0
    horizon_length: 16
    learning_rate: 2e-5
    lr_schedule: constant
    max_epochs: 100000
    mini_epochs: 6
    minibatch_size: 8192
    mixed_precision: false
    multi_gpu: false
    name: mimic
    normalize_advantage: true
    normalize_input: true
    normalize_value: false
    ppo: true
    print_stats: true
    resume_from: None
    reward_shaper:
      scale_value: 1
    save_best_after: 500
    save_frequency: 500
    save_intermediate: true
    score_to_win: 20000
    seq_len: 4
    tau: 0.95
    truncate_grads: false
  load_checkpoint: false
  model:
    name: intermimic
  network:
    mlp:
      activation: relu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
      units:
      - 1024
      - 1024
      - 512
    name: intermimic
    separate: true
    space:
      continuous:
        fixed_sigma: true
        learn_sigma: false
        mu_activation: None
        mu_init:
          name: default
        sigma_activation: None
        sigma_init:
          name: const_initializer
          val: -2.9
  seed: -1
