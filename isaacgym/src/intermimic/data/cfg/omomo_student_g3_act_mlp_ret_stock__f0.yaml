  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  localRootObs: false
  moreRigid: false
  motion_file: InterAct/behave_cari4d_act
  numEnvs: 4096
  numObs: 9594
  objectConvexHull: true
  objectPropsFile: isaacgym/src/intermimic/data/cfg/object_props_g3_act.yaml
  obsHorizons:
