# STUDENT, ACTIVITIES, MLP / RET / STOCK. Distills the three activity g3 teachers
# (bball7 + soccer15 + cpr13; 3 checkpoints serving 35 sources) into one MLP
# student via InterMimicDistillG3. Hand-written from
# omomo_teacher_g3_bball7_geoall__f0.yaml (the recipe verbatim: obsHorizons
# [1,4,7,10,13,16] / numObs 9594 / geometric_all / rollout 50 / initVel / PSI 3 /
# pose 0.02 / bodyNormalizedReward / cpuMotionData / gate resets / all four
# resetThresholds / buffer 12.0 / f0's 43 bodies). tests/test_student_g3_cfgs.py
# pins the diff vs that file to EXACTLY these keys:
#
#   motion_file           InterAct/behave_cari4d_act -- the three arms' clips in
#                         one dir (symlinks), built by scripts/merge_activity_data.py
#   retargetedMotionDir   InterAct/behave_cari4d_act_f0_bodymajor -- merged tree
#   dataSub               the union: 7 bball + 15 soccer + 13 cpr = 35 sources
#   objectPropsFile       per-object {mass, restitution} written by the merge
#                         script from each arm's cfg (bball 0.624 kg / soccer
#                         0.43 / manikin 3.7). REPLACES objectMass and
#                         objectShapeProps.restitution, which are one value for
#                         every object and cannot be right for a ball and a manikin.
#   plane.restitution     0.7 (bball7 had 0.85). The student has ONE plane; each
#                         object's restitution is solved so its ball-floor PhysX
#                         average equals its teacher's (bball 1.0, soccer 0.6,
#                         cpr 0.05 -- utils/object_props.py). Ball-hand pairs
#                         shift by +0.075 (bball) / -0.025 (soccer): the cost.
#   raggedMotionData      true -- padded, the merged set is 132 clips x 43 bodies
#                         at the 691-frame longest (cpr) ~ 35 GB motion, ~84 GB
#                         resident: the edge of an 85 GB VM. Ragged ~10-15 GB.
#   + the four distill keys at the end of env: (teacherPolicy
#     checkpoints/teachers/g3_act = bball7.pth soccer15.pth cpr13.pth + teachers.yaml)
#
# Twin: the XF student (_xf_ret_nvadlr) shares this env byte-for-byte below the
# header. objectConvexHull stays true (all three arms set it).
