# STUDENT, OMOMO, MLP / RET / STOCK. Distills the 13 per-source g3 OMOMO teachers
# into one MLP student via InterMimicDistillG3 (task: --task InterMimicDistillG3,
# entry: intermimic.run_distill). Hand-written from
# omomo_teacher_g3_omomo_geoall_srcall13__f0.yaml: the DATA is that arm's
# verbatim (13 sources, f0's 43 bodies, merged contact-retarget tree, ragged,
# cpuMotionData) so the student sees exactly the (body, clip) references its
# teachers were trained on. FOUR keys added at the end of env:, nothing else
# differs -- scripts/cfg_diff.py against the srcall13 cfg must show only them.
#
#   teacherPolicy       checkpoints/teachers/g3_omomo -- 13 files + teachers.yaml,
#                       written by scripts/collect_g3_teachers.py (sub2's teacher
#                       is the base arm smplx_teacher_g3_omomo_geoall__f0)
#   teacherPolicyCFG    the g3 train cfg (MLP 1024/1024/512): every g3 teacher
#                       shares it, so one network builder serves the whole fleet
#   studentObsHorizons  [1,4,7,10,13,16] -- the recipe's six, same as the teacher
#   numObsRetarget      9594 = 6 x 1599 (checked at startup against numObs)
#
# The teacher is queried on obs_buf (numObs 9594 over obsHorizons, built from
# the per-body retargeted reference -- what it trained on); the student reads
# the same reference over studentObsHorizons. Routing: each env's teacher is
# the one owning its clip's SOURCE subject.
#
# RAM: identical to the srcall13 teacher (one reference set, ragged, ~226 GiB
# nominal x the ragged factor measured on that arm). Twin: the XF student
# (_xf_ret_nvadlr) shares this env cfg byte-for-byte except this header.
env:
  asset:
    assetRoot: intermimic/data/assets
  ballSize: 1.0
  bodyNormalizedReward: true
  contactBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  - L_Index3
  - L_Middle3
  - L_Pinky3
  - L_Ring3
  - L_Thumb3
  - R_Index3
  - R_Middle3
  - R_Pinky3
  - R_Ring3
  - R_Thumb3
  controlFrequencyInv: 2
  cpuMotionData: true
  raggedMotionData: true
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub1', 'sub2', 'sub3', 'sub5', 'sub6', 'sub7', 'sub8', 'sub9', 'sub11', 'sub12', 'sub14', 'sub15', 'sub17']
  enableDebugVis: false
  enableEarlyTermination: true
  envSpacing: 2
  episodeLength: 300
  hybridInitProb: 0.1
  initVel: true
  isFlagrun: false
  keyBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  localRootObs: false
  moreRigid: false
  motion_file: InterAct/OMOMO_new
  numEnvs: 4096
  numObs: 9594
  objectDensity: 200
  obsHorizons:
  - 1
  - 4
  - 7
  - 10
  - 13
  - 16
  pdControl: true
  physicalBufferSize: 3
  plane:
    dynamicFriction: 0.9
    restitution: 0.7
    staticFriction: 0.9
  playdataset: false
  powerScale: 1.0
  projtype: None
  resetThresholds:
    contactSteps: 10
    human: 0.5
    igRatio: 2.0
    object: 0.5
  retargetedMotionDir: InterAct/OMOMO_retarget_contact_srcall13
  rewardShape: geometric_all
  rewardTerms:
    freeFlightGate:
      resets: true
      reward: false
    pose:
      enable: true
      lambda: 0.02
  rewardWeights:
    cg_all: 3.0
    cg_hand: 5.0
    cg_other: 5.0
    eg1: 2.0e-05
    eg2: 2.0e-05
    eg3: 1.0e-09
    ig: 5.0
    op: 5.0
    opv: 0.1
    or: 0.1
    orv: 0.0
    p: 30.0
    pv: 0.0
    r: 2.5
    rv: 0.0
  robotType: smplx/omomo.xml
  rolloutLength: 50
  saveImages: false
  stateInit: Hybrid
  subjectBodies:
  - sub1
  - sub2
  - sub3
  - sub5
  - sub6
  - sub7
  - sub8
  - sub9
  - sub11
  - sub12
  - sub14
  - sub15
  - sub17
  - sub100
  - sub101
  - sub102
  - sub103
  - sub104
  - sub105
  - sub106
  - sub107
  - sub108
  - sub110
  - sub111
  - sub112
  - sub113
  - sub114
  - sub115
  - sub116
  - sub117
  - sub118
  - sub119
  - sub120
  - sub124
  - sub127
  - sub128
  - sub130
  - sub131
  - sub132
  - sub133
  - sub136
  - sub137
  - sub139
  subjectHeightsFile: scripts/synthetic_heights.json
  terminationHeight: 0.15
  # --- distillation (InterMimicDistillG3) ---
  teacherPolicy: checkpoints/teachers/g3_omomo
  teacherPolicyCFG: intermimic/data/cfg/train/rlg/omomo_teacher_g3_omomo_geoall__f0.yaml
  studentObsHorizons: [1, 4, 7, 10, 13, 16]
  numObsRetarget: 9594
sim:
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
  physx:
    bounce_threshold_velocity: 0.2
    contact_offset: 0.02
    default_buffer_size_multiplier: 12.0
    max_depenetration_velocity: 100.0
    max_gpu_contact_pairs: 34603008
    num_position_iterations: 4
    num_threads: 4
    num_velocity_iterations: 1
    rest_offset: 0.0
    solver_type: 1
  substeps: 2
