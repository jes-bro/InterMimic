# EVAL config -- g3_omomo_geoall_src1__f0 (1 source: sub1, 532 clips).
# Mirrors omomo_teacher_g3_omomo_geoall_src1__f0.yaml. One file, one arm.
#
# It cannot share the sub2 arm's eval config: retargetedMotionDir is NOT
# eval-owned, and this arm reads the src1 tree. Pointing it at the src2 tree
# would raise FileNotFoundError on every sub1 clip -- loudly, by design, but it
# would still be the wrong config.
#
# rewardShape is geometric_all here, matching the arm. It is NOT eval-owned and
# it is NOT comparable across shapes: a geometric_all reward is a different
# scalar from a geometric one, so this arm's reward column may only be read
# against other geoall arms. Success rate and pose error ARE comparable across
# shapes -- they are computed from execution steps and reference distance, not
# from the reward.
#
# SCORING BUDGET -- READ BEFORE COMPARING THIS ARM TO THE sub2 RUNG.
# Success is best-of-N attempts per CLIP: _max_execution_steps[seq_id] is a
# running maximum over every env that ever ran that clip, and the denominator is
# the clip count, not the env count (intermimic.py:1685-1704). Attempts per clip
# therefore scale as envs/clips, and this arm's source holds 532 clips against
# sub2's 52 -- so at an IDENTICAL numEnvs this arm is scored roughly TEN TIMES
# harder per clip. The bias runs against src1 and is independent of how good the
# policy is:
#
#   g3_omomo_geoall__f0     52 clips   ~39 attempts/clip at 2048 envs
#   THIS ARM               532 clips   ~3.8 attempts/clip at 2048 envs
#
# So a src1 WIN over the sub2 rung is a strong result -- it won carrying the
# handicap. A src1 LOSS is AMBIGUOUS and must not be read as "more source motion
# hurts". numEnvs stays 2048 regardless: raising it for this arm alone would
# break comparability with every other arm, which is the worse failure. The fix
# for the ambiguous case is to score both arms on a COMMON clip set -- which the
# src1src2 eval config can do and this one cannot, its tree holding one source.
#
# Every other key, and every eval-owned override, is as in the single-source
# eval config (omomo_eval_g3_omomo_geoall__f0.yaml); the reasons are there.
evalFor:
  - g3_omomo_geoall_src1__f0

env:
  numEnvs: 2048                            # NOT a free knob, and NOT a placeholder.
                                           # Success is the BEST attempt per CLIP:
                                           # _max_execution_steps is indexed by
                                           # seq_id and is a running MAXIMUM, and the
                                           # denominator is the clip count, not the
                                           # env count (intermimic.py:1685-1703). So
                                           # more envs = more attempts per clip = a
                                           # success rate that can only rise and pose
                                           # errors that can only fall. It must be
                                           # IDENTICAL across every arm compared.
                                           # 2048 = the count all 30 g2/g3 arms
                                           # actually trained at (the launchers pass
                                           # --num_envs "${NUM_ENVS:-2048}", which
                                           # overrides the 4096 in their train yamls).
                                           # NOTE: eval CSVs written before 2026-09-04
                                           # used 1024 and are NOT comparable to these.
  envSpacing: 2
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: True
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Start"
  enableEvaluation: True
  rolloutLength: 1000
  physicalBufferSize: 1
  hybridInitProb: 0.1
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub1']                        # overwritten per pair by --data_sub
  subjectBodies: ['sub2']                  # patched per pair by eval_per_pair.py
  retargetedMotionDir: InterAct/OMOMO_retarget_contact_src1
  cpuMotionData: true
  subjectHeightsFile: scripts/synthetic_heights.json
  bodyNormalizedReward: true
  ballSize: 1.
  numObs: 9594                             # 6 horizons x 1599, no betas block
  obsHorizons: [1, 4, 7, 10, 13, 16]
  motion_file: InterAct/OMOMO_new
  robotType: "smplx/omomo.xml"             # fallback only; ignored when subjectBodies is set
  objectDensity: 200
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3","L_Thumb3","R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3","R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True

  resetThresholds:
    human: 0.5
    object: 0.5
    igRatio: 2.0
    contactSteps: 10

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.7

  rewardShape: geometric_all

  rewardTerms:
    pose:
      enable: true
      lambda: 0.02
    freeFlightGate:
      reward: false
      resets: true

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.

    op: 5.0
    or: 0.1
    opv: 0.1
    orv: 0.

    ig: 5.

    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.

    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 12.0
    max_gpu_contact_pairs: 34603008

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
