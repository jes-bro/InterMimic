# SOURCE-QUANTITY ladder, top single-source rung: ONE source, sub1 (532 clips).
#
# TWO functional edits vs g3_omomo_geoall__f0 -- and they are one change, not two:
#   dataSub             ['sub2'] -> ['sub1']
#   retargetedMotionDir src2 tree -> the src1 tree
#
# The second follows from the first. Retargeting is solved per SOURCE, so an arm
# reading sub1's clips must point at sub1's tree
# (<dir>/<body>/sub1_<obj>_<idx>.pt). ONE source means NO merge is needed here --
# slurm_retarget_gen.sh writes InterAct/OMOMO_retarget_contact_src1 directly,
# unlike the src26/src269/srctop3 arms which need merge_retarget_trees.py.
#
# WHAT THIS ASKS. Does the AMOUNT of source motion matter, holding the NUMBER of
# sources fixed? The existing ladder cannot say: g3_omomo_geoall__f0 -> src26 ->
# src269 raises clip count AND source diversity together, so an improvement is
# attributable to neither. This arm moves quantity alone:
#
#   g3_omomo_geoall__f0   sub2    52 clips   1 source
#   THIS ARM              sub1   532 clips   1 source    (10x the motion)
#
# sub1 is the largest single source in f0's training set -- 532 clips, measured
# from the rt-gen batch header (532 x 43 bodies = 22876 pairs), against 52 for
# sub2 and 278 for sub6. So this is also the CEILING for a single-source teacher:
# the bar the multi-source arms have to clear to justify themselves.
#
# Its partner is g3_omomo_geoall_src1src2__f0 (584 clips, 2 sources), which holds
# clip count near-fixed and varies source diversity instead -- the other axis of
# the 2x2.
#
# MEMORY: 532 x 43 = 22876 per-body references, ~141 GB resident (hoi_data plus
# 3x hoi_refs under PSI 3), so the slurm script asks for 192G. The 64G inherited
# from the single-source arms is sized for 2236 motions and OOM-kills here (job
# 17285379): CPU RAM, not VRAM -- cpuMotionData keeps these tensors on the host.
#
# NO BETAS. With betas_file absent, _use_betas_obs is False, so the 32-dim
# (source_betas, target_betas) block is NEVER concatenated into the observation
# (intermimic.py:1574-1581) -- numObs 9594 here against 9626 on the betas arm.
# source_betas IS still allocated, as zeros (line 388), but nothing ever reads
# it: both call sites are guarded by _use_betas_obs. So changing the source set
# cannot shift the conditioning vector, because there is no conditioning vector
# to shift. On a betas arm there would be, and the comparison against the
# single-source rung would not be clean.
