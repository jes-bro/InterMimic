# STUDENT, ACT7, XF / RET / NVADLR. Distills the three 7-PEOPLE activity
# g3 teachers (bball7 + soccer7 + cpr7; 3 checkpoints, 21 sources) into one
# 6-TOKEN TRANSFORMER student via InterMimicDistillG3 -- the 7-people twin of the
# activity student (omomo_student_g3_act_*: bball7 + soccer15 + cpr13, 35 sources).
# Identical to that env except: dataSub (the 7-arms' union, 21), the merged
# data dirs (behave_cari4d_act7 / _act7_f0_bodymajor), the props file
# (object_props_g3_act7.yaml) and teacherPolicy (g3_act7). Built by:
#   python3 scripts/merge_activity_data.py --arms bball7 soccer7 cpr7 \
#       --out-motion InterAct/behave_cari4d_act7 --out-retarget InterAct/behave_cari4d_act7_f0_bodymajor \
#       --props-out isaacgym/src/intermimic/data/cfg/object_props_g3_act7.yaml \
#       --bodies-from isaacgym/src/intermimic/data/cfg/omomo_student_g3_act7_mlp_ret_stock__f0.yaml --student-plane-restitution 0.7
#   python3 scripts/collect_g3_teachers.py --activities bball7 soccer7 cpr7 --out checkpoints/teachers/g3_act7
# See the act student's header for every physics decision (per-object mass /
# restitution vs a single plane at 0.7). Twin shares this env below the header.
env:
  asset:
    assetRoot: intermimic/data/assets
  ballSize: 1.0
  bodyNormalizedReward: true
  contactBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  - L_Index3
  - L_Middle3
  - L_Pinky3
  - L_Ring3
  - L_Thumb3
  - R_Index3
  - R_Middle3
  - R_Pinky3
  - R_Ring3
  - R_Thumb3
  controlFrequencyInv: 2
  cpuMotionData: true
  raggedMotionData: true
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub401', 'sub402', 'sub404', 'sub405', 'sub409', 'sub411', 'sub412', 'sub458', 'sub482', 'sub484', 'sub485', 'sub487', 'sub490', 'sub493', 'sub509', 'sub512', 'sub517', 'sub564', 'sub567', 'sub569', 'sub579']
  enableDebugVis: false
  enableEarlyTermination: true
  envSpacing: 2
  episodeLength: 300
  hybridInitProb: 0.1
  initVel: true
  isFlagrun: false
  keyBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  localRootObs: false
  moreRigid: false
  motion_file: InterAct/behave_cari4d_act7
  numEnvs: 4096
  numObs: 9594
  objectConvexHull: true
  objectPropsFile: isaacgym/src/intermimic/data/cfg/object_props_g3_act7.yaml
  obsHorizons:
