# Per-object props for the NOVICE demo (one clip, one object).
#
# The novice take converts to sub204_bball_000.pt, whose object name is the
# generic `bball` (assets/objects/bball.urdf), not one of the per-clip balls the
# bball7 arm carries (bballd03s01rev003b and friends). object_props_g3_act.yaml
# therefore has no entry for it, and utils/object_props.validate_props refuses an
# object without one -- deliberately, since a default would give a basketball
# some other object's bounce.
#
# Values are the activity student's basketball numbers, so the demo runs the
# physics the policy trained under: mass 0.624 kg (the bball7 arm's objectMass)
# and restitution 1.0, which is teacher_pair_to_student_object(0.85, 0.85, 0.7)
# for the student's single plane at 0.7 (utils/object_props.py).
objects:
  bball: {mass: 0.624, restitution: 1.0}
