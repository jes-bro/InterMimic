# METHOD CANDIDATE 'xf_nvadlr_nopose' OF g3_omomo_geoall_src3__f0 (OMOMO source sub3, f0's 43 bodies):
# the TRANSFORMER + NVADLR teacher WITHOUT the relative joint-angle reward
# factor. NOT an ablation: the teacher nopose arms beat the with-pose teachers
# (Jess 2026-09-25), so the pose term is being dropped from the method, and
# the student recipe is the 6-token transformer -- this fleet (13 OMOMO
# per-source + bball7 + soccer15) is the method's teacher set for a future
# nopose student on nopose transformer teachers.
#
# The env below this header is omomo_teacher_g3_omomo_geoall_src3__f0.yaml
# BYTE-FOR-BYTE except ONE key (python3 scripts/cfg_diff.py the two files):
#   rewardTerms.pose.enable  true -> false   (lambda left in place, inert)
# The transformer, normalize_value and adaptive LR (exact-KL 0.06) live in
# the train cfg: exactly the srcall13_xf_nvadlr teacher's knobs on this
# source's env. Own experiment name -> own checkpoint dir; the MLP teacher is
# untouched. Storage = the base's. Pinned by tests/test_xf_nopose_teachers.py.
#
# READ: at a MATCHED EPOCH against the MLP teacher of the same source (which
# keeps its pose term) -- that pair moves two things at once (arch+optimizer,
# and the pose term); the srcall13_xf_nvadlr teacher is the with-pose XF
# reference on the union of these sources, not per source.
