# THE g3 RECIPE ON THE EGOEXO4D SOCCER RECONSTRUCTION, ALL 15 PEOPLE.
# Twin of omomo_teacher_g3_bball7_geoall__f0.yaml. What differs, and only this
# (python3 scripts/cfg_diff.py the two files):
#
#   motion_file           InterAct/behave_cari4d_soccer_cf    61 clips, 15 people
#   dataSub               sub405 480 482 484 485 487 488 489 490 491 493 494 495 496 497
#   retargetedMotionDir   the merged 15-source tree, f0's 43 bodies, body-major
#   objectMass 0.43       a size-5 soccer ball is 0.41-0.45 kg (bball: 0.624)
#   restitution 0.65      ball and plane (bball: 0.85); PhysX averages the two
#
# THE DATA (2026-09-13). CARI4D reconstructions of EgoExo4D soccer takes:
# 62 clips downloaded from 15 CARI4D Sub ids, verified 15 distinct EgoExo4D
# participants via takes.json; 1 dropped (Sub05 t002bts07: the ball leaves with
# the foot 28.8 cm away at the kick). Subject id = 400 + Sub. One body per
# person = MEDIAN over that person's distinct solves (sub487 had one outlier
# take at betas[0] 2.04 vs ~1.1 elsewhere; mean would fit no clip).
#
# CONTACT LABELS: scripts/relabel_contact_soccer.py, foot bodies only, from
# the foot COLLISION SURFACE (rig geoms) to the ball surface, threshold 7 cm
# (a 7 cm kick looks like a touch on video; recon-free frames leak 0.1%).
# 16 clips have no foot within 7 cm anywhere and were kept ALL-FREE after Jess
# reviewed them (kicks with the foot up to ~27 cm off at the impulse, judged
# learnable: the ball-trajectory reward drives the kick; plus non-kick drills,
# in scope for soccer). Names + gaps: soccer-relabel.txt on the cluster.
# NOTE this is a looser standard than bball7's (4 clips dropped at 3.6-9.5 cm).
#
# OBJECT. Every clip keeps ITS OWN reconstructed ball (61 object names, 61
# URDFs), each set to 0.43 kg from its own hull volume (objectMass), single
# convex hull (objectConvexHull). 14 clips have a ball-track teleport > 0.5 m
# in one frame; tolerated -- the object reward stays on in free flight (gate
# reward:false) so it costs a few unearnable frames, no reset.
#
# BODIES: f0's 43 OMOMO bodies (same train/test split as every f0 arm; sub10
# sub13 sub16 held out). CLIP LENGTH (manifest n_frames): 30-677; 8 clips are
# under rolloutLength 50 (start pinned to 0 on those). Padded storage: 2623
# motions x 677 frames x 8.8 kB ~ 15.7 GB -> ~44 GiB RSS by the validated RAM
# model (14.2 + 2.02 x motion), under the launcher's 64G; no ragged flag.
#
# Recipe verbatim: obsHorizons [1,4,7,10,13,16], numObs 9594, no betas,
# geometric_all, rollout 50, initVel, PSI 3, pose 0.02, bodyNormalizedReward,
# cpuMotionData, gate resets, all four resetThresholds, buffer 12.0, 2048 envs.
