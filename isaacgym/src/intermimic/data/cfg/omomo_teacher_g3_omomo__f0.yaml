# ARM A -- THE RECIPE ON OMOMO. f0's 43 bodies, OMOMO retargeted references.
#
# One recipe, two datasets: this arm and the bball arm share an identical
# learning configuration and differ only in the motion data and the object's own
# physical properties (density, restitution), which are measured facts about the
# object rather than choices about the algorithm.
#
# BASE: omomo_teacher_g2_mlp_ret_stock__f0.yaml (43 bodies, contact-retargeted
# refs, betas conditioning, bodyNormalizedReward, PSI 3, cpuMotionData, pose
# lambda 0.02, stock optimizer, buffer multiplier 12.0). Launch at 2048 envs, as
# every GEN-2 cell did.
#
# FROM r8 (the arm that works on the EgoExo4D reconstruction):
#   obsHorizons [1,4,7,10,13,16]  numObs 3230 -> 9626 (6*1599 + 32 betas)
#   rewardShape geometric          rolloutLength 300 -> 50    initVel -> True
#
# rolloutLength 50 is not a preference. Start sampling is
# randint(0, max(1, T - rolloutLength)) (intermimic.py:1269), so at 300 the
# window collapses on any clip shorter than ~300 frames: measured on the cluster,
# 8538 of 8842 OMOMO clips (96.6%) could only ever start at frame 0, making
# stateInit Hybrid silently equal to Start, and PSI harvests only where T >= R
# (psi_update.py:104) so it was inert on 96% of the data. At 50 nothing is pinned
# and every clip is PSI-eligible; the ceiling across all three motion dirs is 60.
#
# TERMINATIONS -- all four criteria LIVE, with the gate handling free flight
# rather than switching criteria off. Measured 2026-09-02 on r8's converged
# policy, one criterion at a time (512 envs, start pinned to frame 0):
#   all three object-side off  100 steps, 100% success, reward 13.4  (r8 as run)
#   object 0.5 alone            23 steps,   0%     <- fatal
#   igRatio 2.0 alone        96-99 steps,   0%     <- kills at the layup
#   contactSteps 10 alone      100 steps, 100%     <- free, 0 diverges / 10240 eps
#   ALL FOUR live, object+ig gated  100 steps, 100%, reward 13.4
# So object and igRatio are gated on reference contact; contactSteps and human
# are left ungated because they cost nothing. On OMOMO the gate should be close
# to inert, since the object is in contact whenever it matters -- that is what
# makes one block valid on both datasets.
#
# freeFlightGate.reward stays FALSE: r8 trains without ro neutralization, and
# r3's reward breakdown refuted it in August (ro was flat across the contact
# split, 0.538 free vs 0.580 held).
#
# NOT taken from r8: objectDensity 86 and restitution 0.85. Those are a
# basketball's measured mass (0.62 kg) and regulation bounce; OMOMO's objects
# keep their own. Facts about the object, not the recipe.
#
# Baseline: smplx_teacher_g2_mlp_ret_stock__f0 -- same data, same 43 bodies, same
# optimizer, same 2048 envs.
