# ABLATION 'realonly' OF g3_bball7_geoall__f0 (EgoExo4D basketball (7 people, 48 clips)).
# ONE key differs from omomo_teacher_g3_bball7_geoall__f0.yaml (python3 scripts/cfg_diff.py):
#   subjectBodies 43 -> the 13 real OMOMO bodies (no synthetic sub1xx bodies)
#
# WHY: Do the 30 synthetic training bodies help the held-out bodies (sub10 sub13 sub16)?
# Off = train on the 13 real f0 bodies only; eval is unchanged (held-out bodies).
#
# Everything else -- data, bodies, recipe, physics -- is the base's; see its header.
# Compare at a MATCHED EPOCH against the base, never at matched wall time.
env:
  asset:
    assetRoot: intermimic/data/assets
  ballSize: 1.0
  bodyNormalizedReward: true
  contactBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  - L_Index3
  - L_Middle3
  - L_Pinky3
  - L_Ring3
  - L_Thumb3
  - R_Index3
  - R_Middle3
  - R_Pinky3
  - R_Ring3
  - R_Thumb3
  controlFrequencyInv: 2
  cpuMotionData: true
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub401', 'sub402', 'sub404', 'sub409', 'sub411', 'sub412', 'sub458']
  enableDebugVis: false
  enableEarlyTermination: true
  envSpacing: 2
  episodeLength: 300
  hybridInitProb: 0.1
  initVel: true
  isFlagrun: false
  keyBodies:
  - L_Hip
  - L_Knee
  - L_Ankle
  - L_Toe
  - R_Hip
  - R_Knee
  - R_Ankle
  - R_Toe
  - Torso
  - Spine
  - Chest
  - Neck
  - Head
  - L_Thorax
  - L_Shoulder
  - L_Elbow
  - L_Wrist
  - R_Thorax
  - R_Shoulder
  - R_Elbow
  - R_Wrist
  localRootObs: false
  moreRigid: false
  motion_file: InterAct/behave_cari4d_bball7_cf2
  numEnvs: 4096
  numObs: 9594
  objectConvexHull: true
  objectMass: 0.624
  objectShapeProps:
    restitution: 0.85
  obsHorizons:
  - 1
  - 4
  - 7
  - 10
  - 13
  - 16
  pdControl: true
  physicalBufferSize: 3
  plane:
    dynamicFriction: 0.9
    restitution: 0.85
    staticFriction: 0.9
  playdataset: false
  powerScale: 1.0
  projtype: None
  resetThresholds:
    contactSteps: 10
    human: 0.5
    igRatio: 2.0
    object: 0.5
  retargetedMotionDir: InterAct/behave_cari4d_bball7_f0_bodymajor
  rewardShape: geometric_all
  rewardTerms:
    freeFlightGate:
      resets: true
      reward: false
    pose:
      enable: true
      lambda: 0.02
  rewardWeights:
    cg_all: 3.0
    cg_hand: 5.0
    cg_other: 5.0
    eg1: 2.0e-05
    eg2: 2.0e-05
    eg3: 1.0e-09
    ig: 5.0
    op: 5.0
    opv: 0.1
    or: 0.1
    orv: 0.0
    p: 30.0
    pv: 0.0
    r: 2.5
    rv: 0.0
  robotType: smplx/omomo.xml
  rolloutLength: 50
  saveImages: false
  stateInit: Hybrid
  subjectBodies:
  - sub1
  - sub2
  - sub3
  - sub5
  - sub6
  - sub7
  - sub8
  - sub9
  - sub11
  - sub12
  - sub14
  - sub15
  - sub17
  subjectHeightsFile: scripts/synthetic_heights.json
  terminationHeight: 0.15
sim:
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
  physx:
    bounce_threshold_velocity: 0.2
    contact_offset: 0.02
    default_buffer_size_multiplier: 12.0
    max_depenetration_velocity: 100.0
    max_gpu_contact_pairs: 34603008
    num_position_iterations: 4
    num_threads: 4
    num_velocity_iterations: 1
    rest_offset: 0.0
    solver_type: 1
  substeps: 2
