# THE OTHER HALF of soccer15: the g3 recipe on the 8 soccer people NOT in the
# soccer7 arm (sub480 sub488 sub489 sub491 sub494 sub495 sub496 sub497), 14 clips. With soccer7 this is a
# two-teacher HALVES split of every soccer person -- the activity analog of
# srchalf6 + srchalf7 on OMOMO -- so an act_halves student (bball7 + soccer7 +
# soccer8 + cpr7 + cpr6, all 35 people) can be compared against the act student
# (bball7 + soccer15 + cpr13) the way omomo_halves compares against omomo.
# Env = omomo_teacher_g3_soccer15_geoall__f0.yaml BYTE-FOR-BYTE except dataSub
# (same motion dir, same merged retarget tree, same object physics, same recipe);
# tests/test_act_halves.py pins that. Small data: expect it to plateau early.
