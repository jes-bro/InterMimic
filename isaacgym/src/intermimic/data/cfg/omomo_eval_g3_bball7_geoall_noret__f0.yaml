# EVAL config -- g3_bball7_geoall_noret__f0 [ABLATION noret: retargetedMotionDir removed (every body tracks the SOURCE reference, no cross-body retargeting)]
# EVAL of the ablation arm; base eval was (52 EgoExo4D basketball clips, 7 people).
# Mirrors omomo_teacher_g3_bball7_geoall__f0.yaml. Cannot share the single-clip
# bball eval config: motion_file, retargetedMotionDir and the object mass are
# NOT eval-owned. Read PER SOURCE (sub401 ... sub458) -- an aggregate hides one
# person collapsing while another improves.
#
# objectMass is carried from the train cfg: every clip has its own reconstructed
# ball, and one density would give them different masses.
evalFor:
  - g3_bball7_geoall_noret__f0

env:
  numEnvs: 1024                            # = InterMimic's own eval scripts
                                           # (isaacgym/scripts/eval_teacher.sh and
                                           # eval_student.sh pass --num_envs 1024).
                                           # This is CONCURRENCY, not the attempt
                                           # budget: the player runs games_num*10 =
                                           # 20,000 episodes per (body, source) pair
                                           # and stops on that count (learning/
                                           # intermimic_players.py:52-60,173,363,392;
                                           # rl_games player.py:41 games_num=2000),
                                           # so attempts per clip do not depend on
                                           # this value. Kept IDENTICAL across every
                                           # eval cfg (check_eval_cfg.py enforces it
                                           # and the value). Was 2048 until 2026-09-18.
  envSpacing: 2
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: True
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Start"
  enableEvaluation: True
  rolloutLength: 1000                     # uniform across every eval cfg; > every clip in any arm (longest: cpr 691)
  physicalBufferSize: 1
  hybridInitProb: 0.1
  dataFPS: 30
  dataFramesScale: 1
  dataSub: ['sub401', 'sub402', 'sub404', 'sub409', 'sub411', 'sub412', 'sub458']   # all sources; overwritten per pair by --data_sub
  subjectBodies: ['sub2']                  # patched per pair by eval_per_pair.py
  cpuMotionData: true
  subjectHeightsFile: scripts/synthetic_heights.json
  bodyNormalizedReward: true
  ballSize: 1.
  numObs: 9594                             # 6 horizons x 1599, no betas block
  obsHorizons: [1, 4, 7, 10, 13, 16]
  motion_file: InterAct/behave_cari4d_bball7_cf2
  robotType: "smplx/omomo.xml"             # fallback only; ignored when subjectBodies is set
  objectMass: 0.624                        # 0.62 kg basketball, per-mesh density
  objectConvexHull: true                   # single hull per ball, no VHACD slivers
  objectShapeProps:
    restitution: 0.85
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3","L_Thumb3","R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3","R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True

  resetThresholds:
    human: 0.5
    object: 0.5
    igRatio: 2.0
    contactSteps: 10

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.85                      # averaged with the object's 0.85

  rewardShape: geometric_all

  rewardTerms:
    pose:
      enable: true
      lambda: 0.02
    freeFlightGate:
      reward: false
      resets: true

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.

    op: 5.0
    or: 0.1
    opv: 0.1
    orv: 0.

    ig: 5.

    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.

    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 12.0
    max_gpu_contact_pairs: 34603008

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
